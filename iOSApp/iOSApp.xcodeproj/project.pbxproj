			shellPath = /bin/sh;
			shellScript = "#!/bin/bash\n# Build phase script - Optimized for team use and CI\nset -e\n\nif [ \"YES\" = \"${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED:-}\" ] || [ \"YES\" = \"${SKIP_KMP_BUILD:-}\" ]; then\n  echo \"Skipping Gradle build task invocation due to OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED environment variable set to \\\"YES\\\"\"\n  exit 0\nfi\n\ncd \"$SRCROOT/..\"\n\n# Optional: override JVM memory if you hit OutOfMemoryError (e.g. on iOS nightly).\n# - GRADLE_OPTS: Gradle daemon heap (e.g. GRADLE_OPTS=\"-Xmx12g\")\n# - KOTLIN_DAEMON_JVM_ARGS: Kotlin compiler daemon heap (passed via -D below)\n# - In-process fallback: set KOTLIN_COMPILER_IN_PROCESS=1 and GRADLE_OPTS=\"-Xmx16g\" to run Kotlin in Gradle JVM (single process, one big heap)\n[ -n \"${GRADLE_OPTS:-}\" ] && export GRADLE_OPTS\n\n# Environment variables required by :shared:embedAndSignAppleFrameworkForXcode\nREQUIRED_ENV_VARS=(\n  \"CONFIGURATION\"\n  \"SDK_NAME\"\n  \"ARCHS\"\n  \"FRAMEWORK_SEARCH_PATHS\"\n  \"BUILT_PRODUCTS_DIR\"\n  \"TARGET_BUILD_DIR\"\n)\n\necho \"Required env vars for :shared:embedAndSignAppleFrameworkForXcode\"\nfor VAR_NAME in \"${REQUIRED_ENV_VARS[@]}\"; do\n  VAR_VALUE=\"${!VAR_NAME:-}\"\n  if [ -z \"$VAR_VALUE\" ]; then\n    echo \"  ${VAR_NAME}=\"\n  else\n    echo \"  ${VAR_NAME}=${VAR_VALUE}\"\n  fi\ndone\n\n# Determine optimal worker count\n# Allow manual override via GRADLE_MAX_WORKERS environment variable\nif [ -n \"${GRADLE_MAX_WORKERS:-}\" ]; then\n  MAX_WORKERS=\"${GRADLE_MAX_WORKERS}\"\n  echo \"Using manual override: ${MAX_WORKERS} workers\"\nelse\n  # Auto-detect CPU cores\n  if command -v sysctl >/dev/null 2>&1; then\n    # macOS\n    TOTAL_CORES=\"$(sysctl -n hw.ncpu)\"\n  elif command -v nproc >/dev/null 2>&1; then\n    # Linux (if ever needed)\n    TOTAL_CORES=\"$(nproc)\"\n  else\n    # Fallback to conservative default\n    TOTAL_CORES=4\n  fi\n  \n  # Use ~90% of cores (rounded down), clamped to a minimum of 2 and a maximum of 8 for iOS\n  # (lower cap reduces parallel Kotlin/Native compilation and avoids Java heap OOM).\n  MAX_WORKERS=$(( TOTAL_CORES * 9 / 10 ))\n  [ \"$MAX_WORKERS\" -lt 2 ] && MAX_WORKERS=2\n  [ \"$MAX_WORKERS\" -gt 8 ] && MAX_WORKERS=8\n  \n  echo \"Auto-detected ${TOTAL_CORES} cores, using ${MAX_WORKERS} workers\"\nfi\n\necho \"Generating KMP framework for iOS\"\n\n# Optional Kotlin daemon heap override or in-process compiler (reduces OOM by using single JVM)\nKOTLIN_OPTS=()\nif [ -n \"${KOTLIN_COMPILER_IN_PROCESS:-}\" ]; then\n  KOTLIN_OPTS=(-Dkotlin.compiler.execution.strategy=in-process)\n  echo \"Using Kotlin compiler in-process (set GRADLE_OPTS e.g. -Xmx16g for heap)\"\nelif [ -n \"${KOTLIN_DAEMON_JVM_ARGS:-}\" ]; then\n  KOTLIN_OPTS=(-Dkotlin.daemon.jvmargs=\"${KOTLIN_DAEMON_JVM_ARGS}\")\n  echo \"Using Kotlin daemon JVM args override: ${KOTLIN_DAEMON_JVM_ARGS}\"\nfi\n\n# Optional: set NO_KMP_BUILD_CACHE=1 in the Xcode scheme Environment Variables if the embedded\n# Shared.framework still looks stale after editing shared/ (disables Gradle build cache + Kotlin incremental for this run).\nGRADLE_CACHE_FLAGS=\"--build-cache -Dorg.gradle.caching=true -Dkotlin.incremental=true -Dkotlin.incremental.native=true\"\nif [ \"${NO_KMP_BUILD_CACHE:-}\" = \"1\" ]; then\n  echo \"NO_KMP_BUILD_CACHE=1: disabling Gradle build cache and Kotlin incremental for this embed task\"\n  GRADLE_CACHE_FLAGS=\"--no-build-cache -Dorg.gradle.caching=false -Dkotlin.incremental=false -Dkotlin.incremental.native=false\"\nfi\n\n# Optimized Gradle flags for faster iOS builds\n./gradlew :shared:embedAndSignAppleFrameworkForXcode \\\n  \"${KOTLIN_OPTS[@]}\" \\\n  $GRADLE_CACHE_FLAGS \\\n  --parallel \\\n  --max-workers=\"${MAX_WORKERS}\" \\\n  -Dorg.gradle.parallel=true \\\n  -Dorg.gradle.daemon=true\n";
		};
